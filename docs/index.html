<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dispatch — Marketing Mission Control</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
            background: #1a1a27;
            color: #f2f2f5;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .container {
            text-align: center;
            padding: 2rem;
            max-width: 600px;
        }
        h1 {
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
        }
        .tagline {
            font-size: 1.2rem;
            color: #a0a0b8;
            margin-bottom: 2rem;
        }
        .cta {
            display: inline-block;
            background: #5b7cff;
            color: #fff;
            padding: 0.75rem 2rem;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            transition: background 0.2s;
        }
        .cta:hover { background: #4a6ae0; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Dispatch</h1>
        <p class="tagline">Marketing Mission Control for indie developers</p>
        <a href="https://github.com/particular-labs/dispatch-releases/releases" class="cta">Download</a>
    </div>

</html>
